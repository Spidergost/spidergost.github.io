<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidergost | Hub Automatique de Projets</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e1e1e6;
            --text-muted: #a8a8b3;
            --accent: #9871f5;
            --border: #29292e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            color: #fff;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            max-width: 800px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .card:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
            color: #fff;
            word-break: break-word;
        }

        .card p {
            margin: 0 0 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            background-color: rgba(152, 113, 245, 0.1);
            color: var(--accent);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .stars {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .loading, .error {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 3rem 0;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font: inherit;
        }

        footer {
            margin-top: auto;
            padding-top: 3rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>@Spidergost</h1>
        <p>Mes projets et applications déployés via GitHub Pages</p>
    </header>

    <main class="grid" id="projects-grid" aria-live="polite" aria-busy="true">
        <div class="loading">Chargement de mes projets en cours...</div>
    </main>

    <footer>
        <p>© 2026 Spidergost — Généré dynamiquement</p>
    </footer>

    <script>
        // Compte public à afficher ; aucun jeton ne doit être ajouté dans cette page.
        const username = 'Spidergost';

        function showStatus(grid, message, isError = false) {
            const status = document.createElement('div');
            status.className = isError ? 'error' : 'loading';
            const text = document.createElement('p');
            text.textContent = message;
            status.appendChild(text);

            if (isError) {
                const retry = document.createElement('button');
                retry.type = 'button';
                retry.textContent = 'Réessayer';
                retry.addEventListener('click', fetchGitHubPages);
                status.appendChild(retry);
            }

            grid.replaceChildren(status);
        }

        async function fetchGitHubPages() {
            const grid = document.getElementById('projects-grid');
            grid.setAttribute('aria-busy', 'true');
            showStatus(grid, 'Chargement de mes projets en cours...');

            try {
                const repos = [];
                let page = 1;
                let batch;

                do {
                    const response = await fetch(
                        `https://api.github.com/users/${encodeURIComponent(username)}/repos?per_page=100&sort=updated&type=owner&page=${page}`,
                        { headers: { Accept: 'application/vnd.github+json' } }
                    );

                    if (!response.ok) {
                        if (response.status === 403 || response.status === 429) {
                            throw new Error('Accès GitHub refusé ou limite de requêtes atteinte. Réessayez plus tard.');
                        }
                        if (response.status === 404) {
                            throw new Error(`Le compte GitHub ${username} est introuvable.`);
                        }
                        throw new Error(`Erreur API GitHub (HTTP ${response.status}).`);
                    }

                    batch = await response.json();
                    if (!Array.isArray(batch)) {
                        throw new Error('La réponse de GitHub ne contient pas une liste de dépôts.');
                    }
                    repos.push(...batch);
                    page += 1;
                } while (batch.length === 100);

                const rootRepoName = `${username}.github.io`.toLowerCase();
                const pagesRepos = repos.filter(repo => repo.has_pages);

                if (pagesRepos.length === 0) {
                    showStatus(grid, 'Aucun site GitHub Pages public trouvé. Activez GitHub Pages dans les réglages de vos dépôts pour les voir apparaître !');
                    return;
                }

                const cards = document.createDocumentFragment();

                pagesRepos.forEach(repo => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    const isRoot = repo.name.toLowerCase() === rootRepoName;
                    card.href = `https://${username.toLowerCase()}.github.io/${isRoot ? '' : `${encodeURIComponent(repo.name)}/`}`;

                    const content = document.createElement('div');
                    const title = document.createElement('h2');
                    title.textContent = `🔗 ${repo.name}`;
                    const description = document.createElement('p');
                    description.textContent = repo.description || 'Aucune description fournie pour ce projet.';
                    content.append(title, description);

                    const meta = document.createElement('div');
                    meta.className = 'meta';
                    const language = document.createElement('span');
                    language.className = 'badge';
                    language.textContent = repo.language || 'Web';
                    const stars = document.createElement('span');
                    stars.className = 'stars';
                    stars.textContent = repo.stargazers_count > 0 ? `⭐ ${repo.stargazers_count}` : '';
                    meta.append(language, stars);
                    card.append(content, meta);
                    cards.appendChild(card);
                });
                grid.replaceChildren(cards);
            } catch (error) {
                console.error(error);
                const detail = error instanceof Error ? error.message : 'Erreur inconnue.';
                showStatus(grid, `Impossible de récupérer les sites GitHub Pages. ${detail} Vérifiez votre connexion si le problème persiste.`, true);
            } finally {
                grid.setAttribute('aria-busy', 'false');
            }
        }

        fetchGitHubPages();
    </script>
</body>
</html>
